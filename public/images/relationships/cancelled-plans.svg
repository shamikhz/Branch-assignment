<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1822" />
      <stop offset="100%" stop-color="#2c1a29" />
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="16" fill="url(#bgGrad)" />
  <!-- Calendar Base -->
  <rect x="42" y="48" width="116" height="110" rx="12" fill="#18131d" stroke="#f43f5e" stroke-width="2.5" stroke-opacity="0.5" />
  <path d="M42 78h116" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.4" />
  <!-- Binder Rings -->
  <rect x="64" y="38" width="8" height="18" rx="4" fill="#ec4899" />
  <rect x="128" y="38" width="8" height="18" rx="4" fill="#ec4899" />
  <!-- Cancelled Marker (X & Clock) -->
  <circle cx="86" cy="116" r="24" fill="#2d1525" stroke="#ec4899" stroke-width="2" />
  <path d="M86 102v14l10 6" stroke="#fbcfe8" stroke-width="2.5" stroke-linecap="round" />
  <!-- Message Bubble "Can't make it tonight..." -->
  <rect x="100" y="96" width="60" height="34" rx="8" fill="url(#roseAccent)" opacity="0.9" />
  <path d="M100 120l-8 6v-8" fill="#f43f5e" />
  <circle cx="118" cy="113" r="3" fill="#fff" />
  <circle cx="130" cy="113" r="3" fill="#fff" />
  <circle cx="142" cy="113" r="3" fill="#fff" />
</svg>
