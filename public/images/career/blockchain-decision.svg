<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
    <rect width="800" height="450" fill="#0f172a"/>
    <g transform="translate(80, 80)">
      <!-- Centralized Database Option -->
      <rect x="0" y="20" width="280" height="240" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
      <text x="24" y="55" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="16">OPTION A: ENCRYPTED RDBMS</text>
      <text x="24" y="90" fill="#cbd5e1" font-family="sans-serif" font-size="13">• Throughput: 12,000 TPS</text>
      <text x="24" y="120" fill="#cbd5e1" font-family="sans-serif" font-size="13">• Cost: $420 / month</text>
      <text x="24" y="150" fill="#cbd5e1" font-family="sans-serif" font-size="13">• Trust Model: Cryptographic signatures</text>
      <text x="24" y="180" fill="#cbd5e1" font-family="sans-serif" font-size="13">• Operational Complexity: Low</text>
      <rect x="24" y="205" width="232" height="32" rx="4" fill="#065f46"/>
      <text x="65" y="226" fill="#ecfdf5" font-family="sans-serif" font-weight="bold" font-size="12">RECOMMENDED FIT (95%)</text>

      <!-- Blockchain Option -->
      <rect x="340" y="20" width="280" height="240" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="364" y="55" fill="#fbbf24" font-family="sans-serif" font-weight="bold" font-size="16">OPTION B: PERMISSIONED LEDGER</text>
      <text x="364" y="90" fill="#94a3b8" font-family="sans-serif" font-size="13">• Throughput: ~85 TPS</text>
      <text x="364" y="120" fill="#94a3b8" font-family="sans-serif" font-size="13">• Cost: $6,500+ / mo node consensus</text>
      <text x="364" y="150" fill="#94a3b8" font-family="sans-serif" font-size="13">• Governance: 14-party multi-sig</text>
      <text x="364" y="180" fill="#94a3b8" font-family="sans-serif" font-size="13">• Complexity: High latency &amp; lock-in</text>
      <rect x="364" y="205" width="232" height="32" rx="4" fill="#78350f"/>
      <text x="385" y="226" fill="#fef3c7" font-family="sans-serif" font-weight="bold" font-size="12">DISPROPORTIONATE OVERHEAD</text>
    </g>
  </svg>