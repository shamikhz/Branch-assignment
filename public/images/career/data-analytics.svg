  <text x="490" y="255" fill="#94a3b8" font-family="monospace" font-size="14">COHORT RETENTION</text>
  <text x="490" y="295" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="bold">-14.2% CHURN</text>
