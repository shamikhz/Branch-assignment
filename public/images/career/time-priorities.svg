<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
    <rect width="800" height="450" fill="#0f172a"/>
    <!-- Eisenhower Matrix -->
    <g transform="translate(100, 50)">
      <!-- Q1: Urgent & Important -->
      <rect x="0" y="0" width="280" height="150" rx="6" fill="#450a0a" stroke="#dc2626"/>
      <text x="20" y="30" fill="#fca5a5" font-family="sans-serif" font-weight="bold" font-size="14">DO FIRST (URGENT &amp; IMPORTANT)</text>
      <text x="20" y="65" fill="#ffffff" font-family="sans-serif" font-size="13">Client Severity-1 Outage</text>
      <text x="20" y="95" fill="#ffffff" font-family="sans-serif" font-size="13">Board Audit Compliance Deadline</text>

      <!-- Q2: Not Urgent but Important -->
      <rect x="310" y="0" width="280" height="150" rx="6" fill="#064e3b" stroke="#059669" stroke-width="2"/>
      <text x="330" y="30" fill="#6ee7b7" font-family="sans-serif" font-weight="bold" font-size="14">SCHEDULE (DEEP VALUE FOCUS)</text>
      <text x="330" y="65" fill="#ffffff" font-family="sans-serif" font-size="13">Architecture Roadmap Refactor</text>
      <text x="330" y="95" fill="#ffffff" font-family="sans-serif" font-size="13">Skill Upskilling &amp; Team Mentorship</text>

      <!-- Q3: Urgent not Important -->
      <rect x="0" y="170" width="280" height="150" rx="6" fill="#78350f" stroke="#d97706"/>
      <text x="20" y="200" fill="#fcd34d" font-family="sans-serif" font-weight="bold" font-size="14">DELEGATE / BOUNDARY</text>
      <text x="20" y="235" fill="#ffffff" font-family="sans-serif" font-size="13">Ad-hoc Status Inquiries</text>
      <text x="20" y="265" fill="#ffffff" font-family="sans-serif" font-size="13">Non-critical Meetings</text>

      <!-- Q4: Not Urgent & Not Important -->
      <rect x="310" y="170" width="280" height="150" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="330" y="200" fill="#94a3b8" font-family="sans-serif" font-weight="bold" font-size="14">ELIMINATE / DECLINE</text>
      <text x="330" y="235" fill="#cbd5e1" font-family="sans-serif" font-size="13">Context Switching Loops</text>
      <text x="330" y="265" fill="#cbd5e1" font-family="sans-serif" font-size="13">Unbounded Slack Notification Triage</text>
    </g>
  </svg>